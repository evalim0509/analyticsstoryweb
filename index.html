<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval' 'unsafe-eval'; connect-src 'self' https://cdn.jsdelivr.net; worker-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>Gist — the story in your data</title>
<link rel="stylesheet" href="assets/app.css?v=2026-11-17.2">
</head>
<body>
<header class="top">
  <a class="brand" href="./" aria-label="Gist, start page"><span class="mark" aria-hidden="true"></span>Gist</a>
  <nav class="tabs" id="tabs" hidden aria-label="Sections">
    <button data-view="story">Story</button>
    <button data-view="data">Your data</button>
    <button data-view="ask">Ask</button>
    <button data-view="build">Tables &amp; charts</button>
    <button data-view="predict">Predictions</button>
  </nav>
  <div class="top-right">
    <button class="ghost" id="wordsBtn" hidden>Business words</button>
    <button class="ghost" id="exploreBtn" hidden>Explore further</button>
    <button class="ghost" id="addBtn" hidden>Add files</button>
  </div>
</header>

<main id="main">
  <section id="welcome" class="welcome">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Drop a file here, or press Enter to choose files">
      <h1>Drop a file to begin</h1>
      <p class="lede">Excel, CSV, Word, PowerPoint or PDF. I'll read it and give you the gist in a few steps: what, who, when, which, why and how.</p>
      <div class="drop-actions">
        <button class="primary" id="chooseBtn">Choose files</button>
        <button class="secondary" id="sampleBtn">Try it with sample data</button>
      </div>
      <p class="engine" id="engineStatus" role="status">Getting ready…</p>
    </div>
  </section>
  <section id="view-pick" class="story" hidden></section>
  <section id="view-story" class="story" hidden></section>
  <section id="view-data" class="view" hidden></section>
  <section id="view-ask" class="view" hidden></section>
  <section id="view-build" class="view" hidden></section>
  <section id="view-predict" class="view" hidden></section>
</main>

<input type="file" id="fileInput" multiple hidden accept=".xlsx,.xlsm,.xls,.csv,.tsv,.docx,.pptx,.pdf,.txt,.md,.json">
<div id="overlay" class="overlay" hidden><div>Drop to add</div></div>
<div id="modal" class="modal" hidden role="dialog" aria-modal="true"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="assets/vendor/chart.umd.js?v=2026-11-17.2"></script>
<script src="assets/charts.js?v=2026-11-17.2"></script>
<script src="assets/app.js?v=2026-11-17.2"></script>
</body>
</html>
